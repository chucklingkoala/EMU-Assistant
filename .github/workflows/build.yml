name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      # Secrets can't be used in `if:`; this flag can. Signing runs only when a certificate is set.
      HAS_CERT: ${{ secrets.SIGNING_CERT_PFX != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # A tag that doesn't match Cargo.toml would make every copy offer a phantom update.
      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match version $version in Cargo.toml"
            exit 1
          }

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      # Authenticode signature, so SmartScreen knows the publisher. Needs the repository
      # secrets SIGNING_CERT_PFX (the .pfx file, base64) and SIGNING_CERT_PASSWORD.
      - name: Sign
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.SIGNING_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 target/release/EMUAssistant.exe
          $code = $LASTEXITCODE
          Remove-Item $pfx
          if ($code -ne 0) { exit $code }

      # after signing, so the checksum matches the published exe
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/EMUAssistant.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  EMUAssistant.exe" | Out-File -Encoding ascii target/release/EMUAssistant.exe.sha256

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: EMUAssistant
          path: |
            target/release/EMUAssistant.exe
            target/release/EMUAssistant.exe.sha256

  # Pushing a tag like v0.5.0 publishes a GitHub release with the exe attached.
  # Only this job may write to the repository.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EMUAssistant

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EMUAssistant.exe
            EMUAssistant.exe.sha256
          generate_release_notes: true
